<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis pedidos · Hamburguesa de Barrio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6">
<link rel="stylesheet" href="css/app.css?v=6">
</head>
<body>

<div class="grate-overlay" aria-hidden="true"></div>

<header class="nav">
  <a href="index.html" class="nav__brand">
    <span class="nav__brand-mark">HDB</span>
    <span class="nav__brand-name">Hamburguesa<br>de Barrio</span>
  </a>
  <nav class="nav__links">
    <a href="index.html">Inicio</a>
    <a href="index.html#carta">Carta</a>
    <a href="pedido.html" class="nav__links-cta">Pedir ahora</a>
  </nav>
</header>

<main class="app-main">

  <!-- MODO PROTAGONISTA: un pedido en vivo (cuando venís de hacer un pedido) -->
  <div id="focusContainer" style="display:none;">
    <p class="loading-state">Cargando tu pedido...</p>
  </div>

  <!-- MODO LISTA: todos tus pedidos -->
  <div id="listMode">
  <div class="app-header">
    <h1>Mis pedidos</h1>
    <p>Acá podés seguir el estado de tus pedidos. Se actualiza solo.</p>
  </div>

  <!-- Pedidos guardados en este dispositivo -->
  <div id="myOrders" class="track-list">
    <p class="loading-state">Buscando tus pedidos...</p>
  </div>

  <!-- Buscar un pedido a mano -->
  <div class="track-search">
    <h2>¿Pediste desde otro dispositivo?</h2>
    <p class="sub">Buscalo con el número de pedido y tu teléfono.</p>
    <form id="searchForm">
      <div class="form-field">
        <label for="searchId">Número de pedido</label>
        <input type="number" id="searchId" required placeholder="Ej: 12">
      </div>
      <div class="form-field">
        <label for="searchPhone">Teléfono (el mismo que pusiste al pedir)</label>
        <input type="tel" id="searchPhone" required placeholder="221 xxx xxxx">
      </div>
      <p class="form-error" id="searchError"></p>
      <button type="submit" class="btn btn--gold">Buscar pedido</button>
    </form>
  </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js?v=6"></script>
<script src="js/seguimiento.js?v=6"></script>
</body>
</html>
